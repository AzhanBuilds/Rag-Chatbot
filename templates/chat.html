<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RAG Chatbot</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <div class="chat-container">

        <div class="header">
            <h1>🤖 RAG Chatbot</h1>
            <p>This is an AI-Powered RAG Chatbot</p>
        </div>


        <div class="chat-box">

            {% if question %}

            <div class="message user-message">

                <div class="label">
                    You
                </div>

                <div class="message-text">
                    {{ question }}
                </div>

            </div>

            {% endif %}


            {% if answer %}

            <div class="message ai-message">

                <div class="label">
                    AI
                </div>

                <div class="message-text">
                    {{ answer | safe }}
                </div>

            </div>

            {% endif %}

        </div>

        <form method="POST" class="input-area">

            <input
                type="text"
                name="question"
                placeholder="Ask Something..."
                required
                autocomplete="off"
            >

            <button type="submit">
                Ask
            </button>

        </form>

    </div>

</body>

</html>
